plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.11.1'
    id 'org.cyclonedx.bom' version '3.5.1'
    id 'jacoco'
}

group = 'dev.gdiniz'
version = '0.0.1-SNAPSHOT'
description = 'discord-event-gateway'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    jdaVersion        = '5.2.1'
    resilience4jVersion = '2.3.0'
    awsSdkVersion     = '2.29.50'
    uuidGeneratorVersion = '5.1.0'
    logstashVersion   = '8.0'
    springCloudVersion = '2025.1.4'
}

dependencyManagement {
    imports {
        mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
        mavenBom "io.github.resilience4j:resilience4j-bom:${resilience4jVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'com.google.protobuf' && details.requested.name == 'protobuf-java') {
            details.useVersion '3.25.5'
            details.because 'Remediate CVE-2024-7254 and CVE-2024-5853'
        }
        if (details.requested.group == 'at.yawk.lz4' && details.requested.name == 'lz4-java') {
            details.useVersion '1.11.4'
            details.because 'Remediate CVE-2026-106451 and related LZ4 denial-of-service vulnerabilities'
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-config'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    implementation("net.dv8tion:JDA:${jdaVersion}") {
        exclude group: 'club.minnced', module: 'opus-java'
    }

    implementation 'io.github.resilience4j:resilience4j-circuitbreaker'
    implementation 'io.github.resilience4j:resilience4j-micrometer'
    implementation 'software.amazon.awssdk:s3'
    implementation "com.fasterxml.uuid:java-uuid-generator:${uuidGeneratorVersion}"
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation "net.logstash.logback:logstash-logback-encoder:${logstashVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'org.testcontainers:testcontainers-localstack'
    testImplementation 'org.awaitility:awaitility'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('cyclonedxDirectBom') {
    projectType = 'application'
    includeConfigs = ['runtimeClasspath']
}

tasks.named('cyclonedxBom') {
    projectType = 'application'
}

graalvmNative {
    binaries {
        main {
            imageName = 'discord-event-gateway'
            mainClass = 'com.discord.gateway.DiscordEventGatewayApplication'
            buildArgs.addAll(
                '-O3',
                // Bound native-image worker memory on CI and developer machines.
                '--parallelism=4',
                '--no-fallback',
                '--enable-url-protocols=http,https',
                '-march=compatibility',
                '-H:+ReportExceptionStackTraces',
                '-H:+UnlockExperimentalVMOptions',
                '--enable-monitoring=heapdump,threaddump,jfr',
                '-H:Preserve=package=org.flywaydb.*'
            )
        }
    }
}


tasks.matching { it.name.startsWith("processTestAot") || it.name.startsWith("aotTest") }.configureEach {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
    timeout = java.time.Duration.ofMinutes(3)
    environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
