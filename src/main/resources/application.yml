spring:
  application:
    name: discord-event-gateway
  config:
    import: "optional:consul:,optional:file:/vault/secrets/db.yaml,optional:file:/vault/secrets/s3.yaml"

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:consul.consul.svc.cluster.local}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      config:
        enabled: true
        format: YAML
        data-key: data

  threads:
    virtual:
      enabled: true

  datasource:
    hikari:
      data-source-properties:
        stringtype: unspecified

  flyway:
    locations: classpath:db/migration/postgresql
    schemas: gateway
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  kafka:
    consumer:
      group-id: discord-gateway
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      compression-type: lz4
    listener:
      ack-mode: MANUAL_IMMEDIATE

gateway:
  topics:
    MESSAGE_CREATED:
      topic: discord.events.message.created
      priority: normal
    MESSAGE_UPDATED:
      topic: discord.events.message.updated
      priority: low
    INTERACTION_COMMAND:
      topic: discord.events.interaction.command
      priority: normal
    INTERACTION_BUTTON:
      topic: discord.events.interaction.button
      priority: normal
    INTERACTION_MODAL:
      topic: discord.events.interaction.modal
      priority: normal
    GUILD_MEMBER:
      topic: discord.events.guild.member
      priority: low
    GUILD_UPDATED:
      topic: discord.events.guild.updated
      priority: low
    MESSAGE_COMMAND:
      topic: discord.events.message.command
      priority: normal

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  health:
    show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      redpanda:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      postgresql:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      garage:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
