apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-event-gateway
  namespace: discord-event-gateway
  labels:
    app: discord-event-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-event-gateway
  template:
    metadata:
      labels:
        app: discord-event-gateway
    spec:
      containers:
        - name: gateway
          image: localhost:32000/discord-event-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: discord-event-gateway
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
      restartPolicy: Always
