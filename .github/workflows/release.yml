name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/gdinizds/discord-gateway-api:${{ github.ref_name }}

      - name: Scan image for fixable vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/gdinizds/discord-gateway-api:${{ github.ref_name }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.76.1

      - name: Push image
        shell: bash
        run: |
          docker push ghcr.io/gdinizds/discord-gateway-api:${{ github.ref_name }}
          docker tag ghcr.io/gdinizds/discord-gateway-api:${{ github.ref_name }} ghcr.io/gdinizds/discord-gateway-api:latest
          docker push ghcr.io/gdinizds/discord-gateway-api:latest
