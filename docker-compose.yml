services:

  postgres:
    build:
      context: docker/postgres
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron,pg_partman_bgw
      - -c
      - cron.database_name=gateway
      - -c
      - pg_partman_bgw.interval=3600
      - -c
      - pg_partman_bgw.role=gateway
      - -c
      - pg_partman_bgw.dbname=gateway
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --smp=1
      - --overprovisioned
      - --mode=dev-container
      - --default-log-level=warn
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 10s
      retries: 15

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/discord-attachments
      "
    restart: on-failure

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gateway
      DB_USERNAME: gateway_api
      DB_PASSWORD: gateway_api
      SPRING_FLYWAY_USER: gateway_migration
      SPRING_FLYWAY_PASSWORD: gateway_migration
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      GARAGE_ENDPOINT: http://minio:9000
      GARAGE_BUCKET: discord-attachments
      GARAGE_REGION: us-east-1
      GARAGE_ACCESS_KEY: minioadmin
      GARAGE_SECRET_KEY: minioadmin
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
